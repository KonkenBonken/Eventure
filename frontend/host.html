<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventure | Host</title>
    <!-- Add source -->
    <script src="index.js" type="module"></script>
</head>
<body data-role="host">
<h1>Eventure</h1>
<h2>Your Events:</h2>
<!-- Modify event, as the book button is not needed.
     Would be fun if a host can modify / delete event -->
<section id="events"></section>
<br>
<h2>Create event</h2>
<form action="/host" method="post">
  <label for="title">Title:</label>
  <input type="text" id="title" name="title" required><br><br>

  <label for="description">Description:</label>
  <textarea id="description" name="description" rows="2" cols="30" required></textarea><br><br>

  <label for="timestamp">Date and time:</label>
  <input type="datetime-local" id="timestamp" name="timestamp" required><br><br>

  <label for="price">Price:</label>
  <input type="number" id="price" name="price" min="0" required><br><br>

  <label for="capacity">Capacity:</label>
  <input type="number" id="capacity" name="capacity" min="0" placeholder="Leave empty if unlimited"><br><br>

  <input type="submit" value="Create">
</form>
</body>
</html>
