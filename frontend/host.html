<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eventure | Host</title>
    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body data-role="host">
<h1>Eventure</h1>
<a href="/login">Log in / Sign up</a>
<h2>Your Events:</h2>
<section id="events"></section>
<h2>Create event</h2>
<form action="/api/create_event" method="post">
  <label for="title">Title:</label>
  <input type="text" id="title" name="title" required>

  <label for="description">Description:</label>
  <textarea id="description" name="description" rows="2" cols="30" required></textarea>

  <label for="timestamp">Date and time:</label>
  <input type="datetime-local" id="timestamp" name="timestamp" required>

  <label for="price">Price:</label>
  <input type="number" id="price" name="price" min="0" required>

  <label for="capacity">Capacity:</label>
  <input type="number" id="capacity" name="capacity" min="0" placeholder="Leave empty if unlimited">

  <input type="submit" value="Create">
</form>
</body>
</html>
